name: ssr_space
description: SSR SPACE - Simple. Secure. Reliable. Your Finance Space. Pencatatan keuangan multi-dompet dengan workspace bersama dan auto-track notifikasi bank.
publish_to: 'none'
version: 2.13.3+79
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.7
  uuid: ^4.2.2
  crypto: ^3.0.3
  provider: ^6.1.1
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0
  lottie: ^3.6.1
  skeletonizer: ^3.0.0
  csv: ^6.0.0
  pdf: ^3.10.7
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  # Dipin exact: apk.yml mem-patch Java plugin ini (fallback EXTRA_BIG_TEXT).
  # Jangan longgarkan ke ^ tanpa cek ulang string yang di-patch.
  notification_listener_service: 1.0.0
  # NFC e-money (read-only, tanpa top-up).
  prepaid_lib_flutter_null_safety: ^1.0.1
  # NFC gate: cek dukungan/switch HP (API terverifikasi docs 3.6.2).
  flutter_nfc_kit: ^3.6.2
  app_links: ^7.2.1
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  # Dipin exact: 13.x menarik permission_handler_android 14 (butuh
  # compileSdk 37, app 36) → build merah checkReleaseAarMetadata.
  # 12.0.3 = android 13.0.1 (compileSdk 35), API Dart yang dipakai stabil.
  permission_handler: 12.0.3
  timezone: ^0.11.1
  intl: ^0.19.0
  supabase_flutter: ^2.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 700
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-VariableFont_wght.ttf
          weight: 700
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
  assets:
    - assets/illustrations/
    - assets/icons/coolicons/
    - assets/lottie/
    - assets/changelog_id.md
