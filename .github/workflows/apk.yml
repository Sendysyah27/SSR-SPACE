name: build-apk
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: |
          python3 - <<'EOF'
          import glob, os, pathlib, re
          # Patch Java plugin notification_listener_service (versi dipin exact
          # di pubspec): baca EXTRA_BIG_TEXT bila EXTRA_TEXT kosong.
          # SeaBank menaruh detail transfer di BigText saja -> tanpa ini
          # content selalu null ("Amount or type unreadable").
          # Idempoten + diagnostik: gagal = dump konteks, bukan diam.
          cands = glob.glob(os.path.expanduser(
              '~/.pub-cache/hosted/pub.dev/notification_listener_service-*/'
              'android/src/main/java/notification/listener/service/'
              'NotificationListener.java'))
          assert len(cands) == 1, f'java plugin tidak ketemu: {cands}'
          p = pathlib.Path(cands[0])
          s = p.read_text()
          if 'EXTRA_BIG_TEXT' in s:
              print('sudah di-patch, lewati:', cands[0])
          else:
              def show(tag):
                  print(f'--- {tag} ---')
                  for line in s.splitlines():
                      if 'EXTRA_TEXT' in line:
                          print(repr(line))
              a_pat = re.compile(
                  r'CharSequence text = extras\.getCharSequence\(Notification\.EXTRA_TEXT\);')
              if len(a_pat.findall(s)) != 1:
                  show('POLA LIVE GAGAL'); raise SystemExit(1)
              s = a_pat.sub(
                  'CharSequence text = extras.getCharSequence(Notification.EXTRA_TEXT);\n'
                  '            if (text == null) text = extras.getCharSequence(Notification.EXTRA_BIG_TEXT);',
                  s)
              b_pat = re.compile(
                  r'notifyData\.put\("content",\s*extras\.getCharSequence\(Notification\.EXTRA_TEXT\)\s*!=\s*null\s*\?\s*extras\.getCharSequence\(Notification\.EXTRA_TEXT\)\.toString\(\)\s*:\s*null\);')
              if len(b_pat.findall(s)) != 1:
                  show('POLA SCAN GAGAL'); raise SystemExit(1)
              s = b_pat.sub(
                  'CharSequence contentText = extras.getCharSequence(Notification.EXTRA_TEXT);\n'
                  '            if (contentText == null) contentText = extras.getCharSequence(Notification.EXTRA_BIG_TEXT);\n'
                  '            notifyData.put("content", contentText != null\n'
                  '                    ? contentText.toString()\n'
                  '                    : null);',
                  s)
              p.write_text(s)
              assert p.read_text().count('EXTRA_BIG_TEXT') == 2
              print('bigtext patch ok:', cands[0])
          EOF
      - run: |
          python3 - <<'EOF'
          import glob, os, pathlib, re
          # NFC e-money (terbukti spike 2026-09-28): build.gradle plugin
          # prepaid jadul, 3 tambalan agar lolos toolchain modern:
          # 1. jcenter() mati -> mavenCentral().
          # 2. namespace wajib AGP 8+ -> ambil dari package= di manifest
          #    plugin sendiri.
          # 3. compileSdk minimal 35 (flutter_nfc_kit transitif butuh 35+).
          # Tambalan permanen selama pakai prepaid 1.0.1; assert = vonis cepat.
          base = os.path.expanduser(
              '~/.pub-cache/hosted/pub.dev/prepaid_lib_flutter_null_safety-*/android')
          cands = glob.glob(base + '/build.gradle')
          assert len(cands) == 1, f'prepaid build.gradle tak ketemu: {cands}'
          p = pathlib.Path(cands[0])
          s = p.read_text()
          if 'jcenter()' in s:
              s = s.replace('jcenter()', 'mavenCentral()')
          if 'namespace' not in s:
              mans = glob.glob(os.path.expanduser(
                  '~/.pub-cache/hosted/pub.dev/prepaid_lib_flutter_null_safety-*/'
                  'android/src/main/AndroidManifest.xml'))
              assert len(mans) == 1, f'manifest prepaid tak ketemu: {mans}'
              m = pathlib.Path(mans[0]).read_text()
              mm = re.search(r'package="([^"]+)"', m)
              assert mm, 'package attr tak ketemu:\n' + m[:800]
              assert 'android {' in s, 'blok android tak ketemu'
              s = s.replace('android {',
                            'android {\n    namespace "' + mm.group(1) + '"', 1)
          m2 = re.search(r'compileSdkVersion\s+(\d+)', s)
          if m2 and int(m2.group(1)) < 35:
              s = s.replace(m2.group(0), 'compileSdkVersion 35')
          m3 = re.search(r'compileSdk\s+(\d+)', s)
          if m3 and int(m3.group(1)) < 35:
              s = s.replace(m3.group(0), 'compileSdk 35')
          # 4. JVM target tak konsisten (Java 1.8 vs Kotlin 17):
          #    selaraskan Kotlin ke 1.8 bila belum ada jvmTarget.
          if 'jvmTarget' not in s:
              s = s.rstrip() + (
                  '\n\ntasks.withType(org.jetbrains.kotlin.gradle.tasks'
                  '.KotlinCompile).configureEach {\n'
                  "    kotlinOptions.jvmTarget = '1.8'\n}\n")
          p.write_text(s)
          t = p.read_text()
          assert 'jcenter()' not in t, 'jcenter masih ada'
          assert 'namespace' in t, 'namespace gagal disuntik'
          assert 'jvmTarget' in t, 'jvmTarget gagal disuntik'
          print('prepaid native patch ok:', cands[0])
          EOF
      - run: |
          if [ ! -d android ]; then
            flutter create . --project-name ssr_space --org com.ssr.space
          fi
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$M"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' "$M"
          fi
          grep -q "android.permission.INTERNET" "$M"
      - run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl -sL -o android/app/src/main/jniLibs/arm64-v8a/libopencode.so \
            https://github.com/Sendysyah27/SSR-SPACE/releases/download/opencode-bin-v1.18.9/opencode
          echo "622c01ffee1f9b38cb334282cd4795ad997d470357a263da9405727458bb72ce  android/app/src/main/jniLibs/arm64-v8a/libopencode.so" | sha256sum -c -
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libopencode.so
      - run: |
          BG=android/app/build.gradle
          if ! grep -q "doNotStrip" "$BG"; then
            python3 -c "
            import pathlib;
            p = pathlib.Path('android/app/build.gradle');
            t = p.read_text();
            old = '    buildTypes {';
            add = '    packagingOptions {\\n        doNotStrip \"*/arm64-v8a/libopencode.so\"\\n    }\\n';
            assert old in t;
            t = t.replace(old, add + old, 1);
            p.write_text(t);
            print('doNotStrip ok')
            "
          fi
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          if 'NotificationListenerService' not in s:
              svc = '''    <service android:name="notification.listener.service.NotificationListener" android:label="notifications" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
              <intent-filter>
                  <action android:name="android.service.notification.NotificationListenerService" />
              </intent-filter>
          </service>
          '''
              s = s.replace('</application>', svc + '</application>')
              m.write_text(s)
          assert 'NotificationListenerService' in m.read_text()
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          if 'FOREGROUND_SERVICE_SPECIAL_USE' not in s:
              perms = (
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>\n'
              )
              s = s.replace('</manifest>', perms + '</manifest>')
          if 'com.pravera.flutter_foreground_task.service.ForegroundService' not in s:
              svc = '''    <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
            android:foregroundServiceType="specialUse"
            android:exported="false">
            <property android:name="android.app.PROPERTY_FOREGROUND_SERVICE_SPECIAL_USE"
                      android:value="Pencatatan transaksi keuangan dari notifikasi bank saat aplikasi di latar belakang"/>
          </service>
          '''
              s = s.replace('</application>', svc + '</application>')
          m.write_text(s)
          assert 'FOREGROUND_SERVICE_SPECIAL_USE' in m.read_text()
          assert 'com.pravera.flutter_foreground_task.service.ForegroundService' in m.read_text()
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          # Pengingat harian (flutter_local_notifications): POST_NOTIFICATIONS
          # untuk Android 13+ plus RECEIVE_BOOT_COMPLETED agar jadwal
          # harian bisa dijadwal ulang saat app start setelah reboot.
          # Task 9: minifyEnabled=true tanpa rules file custom — plugin
          # membawa consumer-rules sendiri; receiver manifest di-keep
          # otomatis oleh AGP (lihat step minify di bawah).
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>',
              )
          m.write_text(s)
          assert 'android.permission.POST_NOTIFICATIONS' in m.read_text()
          print('post-notifications permission ok')
          s = m.read_text()
          if 'android.permission.RECEIVE_BOOT_COMPLETED' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n</manifest>',
              )
          m.write_text(s)
          assert 'android.permission.RECEIVE_BOOT_COMPLETED' in m.read_text()
          print('boot-completed permission ok')
          s = m.read_text()
          if 'com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver' not in s:
              rcv = '''          <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" android:enabled="true" android:exported="false">
              <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED" />
              </intent-filter>
          </receiver>
          '''
              assert '</application>' in s, 'application block tak ketemu'
              s = s.replace('</application>', rcv + '</application>')
          m.write_text(s)
          assert 'com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver' in m.read_text()
          print('boot receiver ok')
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          # NFC e-money: izin + fitur hardware.
          # required=false supaya HP non-NFC tetap bisa install;
          # dukungan NFC dicek saat runtime di layar uji.
          if 'android.permission.NFC' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.NFC"/>\n</manifest>',
              )
          # Voice input: mic untuk speech-to-text (runtime diminta saat tap).
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n</manifest>',
              )
          # Voice native butuh visibility layanan recognizer (SDK 30+):
          # tanpa queries ini startListening gagal walau init lolos.
          if 'android.speech.RecognitionService' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <queries>\n'
                  '        <intent>\n'
                  '            <action android:name="android.speech.RecognitionService" />\n'
                  '        </intent>\n'
                  '    </queries>\n</manifest>',
              )
          m.write_text(s)
          assert 'android.permission.RECORD_AUDIO' in m.read_text()
          assert 'android.speech.RecognitionService' in m.read_text()
          if 'android.hardware.nfc' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <uses-feature android:name="android.hardware.nfc" android:required="false"/>\n</manifest>',
              )
          m.write_text(s)
          assert 'android.permission.NFC' in m.read_text()
          assert 'android.hardware.nfc' in m.read_text()
          print('nfc spike permission ok')
          # NFC e-money: plugin prepaid
          # butuh minSdk 26, template app 24 -> naikkan ke 26.
          # Konsekuensi produk (Android 8.0+) dibahas di fase desain.
          gkts = pathlib.Path('android/app/build.gradle.kts')
          ggroovy = pathlib.Path('android/app/build.gradle')
          gtarget = gkts if gkts.exists() else ggroovy
          assert gtarget.exists(), 'app build gradle tak ketemu'
          g = gtarget.read_text()
          if gtarget == gkts:
              if 'minSdk = 26' not in g:
                  assert 'flutter.minSdkVersion' in g, 'template minSdk tak ketemu'
                  g = g.replace(
                      'minSdk = flutter.minSdkVersion', 'minSdk = 26')
                  gtarget.write_text(g)
              assert 'minSdk = 26' in gtarget.read_text()
          else:
              if 'minSdk 26' not in g:
                  assert 'flutter.minSdkVersion' in g, 'template minSdk tak ketemu'
                  g = g.replace(
                      'minSdk flutter.minSdkVersion', 'minSdk 26')
                  gtarget.write_text(g)
              assert 'minSdk 26' in gtarget.read_text()
          print('spike minSdk26 ok:', gtarget)
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          # Biometrik (local_auth): izin normal, tanpa dialog runtime.
          if 'android.permission.USE_BIOMETRIC' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n</manifest>',
              )
          m.write_text(s)
          assert 'android.permission.USE_BIOMETRIC' in m.read_text()
          print('biometric permission ok')
          EOF
      - run: |
          python3 - <<'EOF'
          import glob, pathlib
          # Biometrik (local_auth): authenticate() butuh FragmentActivity,
          # template default FlutterActivity → PlatformException
          # no_fragment_activity tiap tap (bug: tombol diam tanpa pesan).
          mains = glob.glob('android/app/src/main/kotlin/**/MainActivity.*',
                              recursive=True)
          mains += glob.glob('android/app/src/main/java/**/MainActivity.*',
                              recursive=True)
          assert len(mains) == 1, f'MainActivity tak ketemu: {mains}'
          p = pathlib.Path(mains[0])
          s = p.read_text()
          if p.suffix == '.kt':
              if 'FlutterFragmentActivity' not in s:
                  assert 'FlutterActivity' in s, 'MainActivity aneh'
                  s = s.replace(
                      'import io.flutter.embedding.android.FlutterActivity',
                      'import io.flutter.embedding.android.FlutterFragmentActivity',
                  )
                  s = s.replace(': FlutterActivity()', ': FlutterFragmentActivity()')
                  s = s.replace(': FlutterActivity', ': FlutterFragmentActivity')
          else:
              if 'FlutterFragmentActivity' not in s:
                  assert 'FlutterActivity' in s, 'MainActivity aneh'
                  s = s.replace(
                      'import io.flutter.embedding.android.FlutterActivity;',
                      'import io.flutter.embedding.android.FlutterFragmentActivity;',
                  )
                  s = s.replace('extends FlutterActivity', 'extends FlutterFragmentActivity')
          p.write_text(s)
          assert 'FlutterFragmentActivity' in p.read_text()
          print('fragment activity ok:', mains[0])
          EOF
      - name: Tulis google-services.json bila secret ada
        env:
          SSR_GOOGLE_SERVICES_JSON: ${{ secrets.SSR_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$SSR_GOOGLE_SERVICES_JSON" ]; then
            echo "$SSR_GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo 'google-services.json ok (native Google login aktif)'
          else
            echo 'tanpa google-services.json (native gagal, fallback browser OAuth)'
          fi
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          # Ekspor Laporan: simpan ke Documents/ssr-space milik user.
          # API 30+ butuh MANAGE_EXTERNAL_STORAGE (minta saat runtime,
          # user menyetujui di halaman akses khusus; APK sideload jadi
          # layak, bukan Play policy). API 29 ke bawah: WRITE klasik +
          # legacy flag agar tulis langsung bisa.
          if 'android.permission.WRITE_EXTERNAL_STORAGE' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n</manifest>',
              )
          if 'android.permission.MANAGE_EXTERNAL_STORAGE' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n</manifest>',
              )
          if 'requestLegacyExternalStorage' not in s:
              if '<application' in s:
                  s = s.replace(
                      '<application',
                      '<application android:requestLegacyExternalStorage="true"',
                      1,
                  )
          m.write_text(s)
          t = m.read_text()
          assert 'android.permission.WRITE_EXTERNAL_STORAGE' in t
          assert 'android.permission.MANAGE_EXTERNAL_STORAGE' in t
          print('storage permissions ok')
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          # Deep link magic-link ganti PIN: com.ssr.space.ssrspace://login-callback
          # (lihat pin_link_verify.dart; redirect URL didaftarkan di Dashboard).
          if 'com.ssr.space.ssrspace' not in s:
              filt = '''          <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="com.ssr.space.ssrspace" android:host="login-callback" />
          </intent-filter>
          '''
              assert '</activity>' in s, 'activity block tak ketemu'
              s = s.replace('</activity>', filt + '      </activity>', 1)
              m.write_text(s)
          assert 'com.ssr.space.ssrspace' in m.read_text()
          print('deeplink intent-filter ok')
          EOF
      - run: |
          python3 - <<'EOF'
          import glob, pathlib
          # Widget Hari Ini + QS tile (P2 widget-qs-tile): provider Java,
          # layout/info XML, dan entri manifest. Ditulis di sini karena
          # folder android/ di-generate CI (tidak di-commit).
          # Data dari prefs FlutterSharedPreferences/flutter.widget_snapshot
          # yang ditulis Beranda (tanpa token, tanpa query di provider).
          mains = glob.glob('android/app/src/main/kotlin/**/MainActivity.*',
                             recursive=True)
          mains += glob.glob('android/app/src/main/java/**/MainActivity.*',
                              recursive=True)
          assert len(mains) == 1, f'MainActivity tak ketemu: {mains}'
          pkgdir = pathlib.Path(mains[0]).parent
          dotted = '.'.join(pkgdir.parts[pkgdir.parts.index('kotlin' if 'kotlin' in pkgdir.parts else 'java') + 1:])
          prov = pkgdir / 'TodayWidgetProvider.java'
          prov.write_text('''package %s;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;

          public class TodayWidgetProvider extends AppWidgetProvider {
              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  // Fix widget FC: ids kosong/null = tak ada kerja; semua
                  // baca prefs + update per-id dijaga (Throwable, bukan
                  // sekadar Exception) supaya satu widget rusak tak
                  // menjatuhkan provider; launch null = tanpa tap.
                  if (ids == null || ids.length == 0) return;
                  String title = "SSR SPACE";
                  String line = "Buka aplikasi untuk memuat";
                  String line2 = "";
                  try {
                      SharedPreferences p = c.getSharedPreferences(
                              "FlutterSharedPreferences", Context.MODE_PRIVATE);
                      String raw = p.getString("flutter.widget_snapshot", null);
                      if (raw != null) {
                          org.json.JSONObject o = new org.json.JSONObject(raw);
                          String date = o.optString("date", "");
                          String text = o.optString("text", "");
                          if (!date.isEmpty()) title = "SSR \\u2022 " + date;
                          if (!text.isEmpty()) line = text;
                          line2 = o.optString("text2", "");
                      }
                  } catch (Throwable ignored) {
                  }
                  for (int id : ids) {
                      RemoteViews v = new RemoteViews(
                              c.getPackageName(), R.layout.today_widget);
                      v.setTextViewText(R.id.wg_title, title);
                      v.setTextViewText(R.id.wg_line, line);
                      v.setTextViewText(R.id.wg_line2, line2);
                      v.setViewVisibility(R.id.wg_line2, line2.isEmpty()
                              ? android.view.View.GONE
                              : android.view.View.VISIBLE);
                      try {
                          Intent launch = c.getPackageManager()
                                  .getLaunchIntentForPackage(c.getPackageName());
                          if (launch != null) {
                              PendingIntent pi = PendingIntent.getActivity(
                                      c, 0, launch,
                                      PendingIntent.FLAG_UPDATE_CURRENT
                                              | PendingIntent.FLAG_IMMUTABLE);
                              v.setOnClickPendingIntent(R.id.wg_root, pi);
                          }
                      } catch (Throwable ignored) {
                      }
                      try {
                          m.updateAppWidget(id, v);
                      } catch (Throwable ignored) {
                      }
                  }
              }
          }
          ''' % dotted)
          tile = pkgdir / 'SsrQsTile.java'
          tile.write_text('''package %s;

          import android.content.SharedPreferences;
          import android.os.Build;
          import android.service.quicksettings.Tile;
          import android.service.quicksettings.TileService;

          public class SsrQsTile extends TileService {
              @Override
              public void onStartListening() {
                  super.onStartListening();
                  Tile t = getQsTile();
                  if (t == null) return;
                  String line = "Buka app untuk memuat";
                  try {
                      SharedPreferences p = getApplicationContext()
                              .getSharedPreferences(
                                      "FlutterSharedPreferences", MODE_PRIVATE);
                      String raw = p.getString("flutter.widget_snapshot", null);
                      if (raw != null) {
                          String text = new org.json.JSONObject(raw)
                                  .optString("text", "");
                          if (!text.isEmpty()) line = text;
                      }
                  } catch (Exception ignored) {
                  }
                  if (Build.VERSION.SDK_INT >= 29) t.setSubtitle(line);
                  t.updateTile();
              }

              @Override
              public void onClick() {
                  super.onClick();
                  try {
                      android.content.Intent i = getApplicationContext()
                              .getPackageManager()
                              .getLaunchIntentForPackage(getPackageName());
                      if (i != null) {
                          i.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivityAndCollapse(i);
                      }
                  } catch (Exception ignored) {
                  }
              }
          }
          ''' % dotted)
          lay = pathlib.Path('android/app/src/main/res/layout/today_widget.xml')
          lay.parent.mkdir(parents=True, exist_ok=True)
