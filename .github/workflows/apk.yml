name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          if [ ! -d android ]; then
            flutter create . --project-name ssr_space --org com.ssr.space
          fi
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$M"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' "$M"
          fi
          grep -q "android.permission.INTERNET" "$M"
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          if 'NotificationListenerService' not in s:
              svc = '''    <service android:name="notification.listener.service.NotificationListener" android:label="notifications" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
              <intent-filter>
                  <action android:name="android.service.notification.NotificationListenerService" />
              </intent-filter>
          </service>
          '''
              s = s.replace('</application>', svc + '</application>')
              m.write_text(s)
          assert 'NotificationListenerService' in m.read_text()
          EOF
      - run: flutter test
      - name: Setup release signing
        env:
          SSR_KEYSTORE_B64: ${{ secrets.SSR_KEYSTORE_B64 }}
          SSR_KEYSTORE_PASS: ${{ secrets.SSR_KEYSTORE_PASS }}
          SSR_KEY_ALIAS: ${{ secrets.SSR_KEY_ALIAS }}
          SSR_KEY_PASS: ${{ secrets.SSR_KEY_PASS }}
        run: |
          echo "$SSR_KEYSTORE_B64" | base64 -d > android/app/ssr-release.jks
          python3 - <<'EOF'
          import pathlib
          kts = pathlib.Path('android/app/build.gradle.kts')
          groovy = pathlib.Path('android/app/build.gradle')
          if kts.exists():
              s = kts.read_text()
              assert 'ssr-release.jks' not in s, 'signing already injected'
              block = (
                  '\n      signingConfigs {\n'
                  '          create("release") {\n'
                  '              storeFile = file("ssr-release.jks")\n'
                  '              storePassword = System.getenv("SSR_KEYSTORE_PASS")\n'
                  '              keyAlias = System.getenv("SSR_KEY_ALIAS")\n'
                  '              keyPassword = System.getenv("SSR_KEY_PASS")\n'
                  '          }\n'
                  '      }\n'
              )
              assert 'android {' in s
              s = s.replace('android {', 'android {' + block, 1)
              old = 'signingConfig = signingConfigs.getByName("debug")'
              assert old in s, 'release signing line not found'
              s = s.replace(old, 'signingConfig = signingConfigs.getByName("release")')
              kts.write_text(s)
          else:
              s = groovy.read_text()
              assert 'ssr-release.jks' not in s, 'signing already injected'
              block = (
                  '\n      signingConfigs {\n'
                  '          release {\n'
                  '              storeFile file("ssr-release.jks")\n'
                  '              storePassword System.getenv("SSR_KEYSTORE_PASS")\n'
                  '              keyAlias System.getenv("SSR_KEY_ALIAS")\n'
                  '              keyPassword System.getenv("SSR_KEY_PASS")\n'
                  '          }\n'
                  '      }\n'
              )
              assert 'android {' in s
              s = s.replace('android {', 'android {' + block, 1)
              old = 'signingConfig signingConfigs.debug'
              assert old in s, 'release signing line not found'
              s = s.replace(old, 'signingConfig signingConfigs.release')
              groovy.write_text(s)
          print('signing injected')
          EOF
      - run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        env:
          SSR_KEYSTORE_PASS: ${{ secrets.SSR_KEYSTORE_PASS }}
          SSR_KEY_ALIAS: ${{ secrets.SSR_KEY_ALIAS }}
          SSR_KEY_PASS: ${{ secrets.SSR_KEY_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: ssr-space-apk
          path: build/app/outputs/flutter-apk/app-release.apk
