          SSR_KEY_PASS: ${{ secrets.SSR_KEY_PASS }}
        run: |
          echo "$SSR_KEYSTORE_B64" | base64 -d > android/app/ssr-release.jks
          python3 - <<'EOF'
          import pathlib
          kts = pathlib.Path('android/app/build.gradle.kts')
          groovy = pathlib.Path('android/app/build.gradle')
          if kts.exists():
              s = kts.read_text()
              assert 'ssr-release.jks' not in s, 'signing already injected'
              block = (
                  '\n      signingConfigs {\n'
                  '          create("release") {\n'
                  '              storeFile = file("ssr-release.jks")\n'
                  '              storePassword = System.getenv("SSR_KEYSTORE_PASS")\n'
                  '              keyAlias = System.getenv("SSR_KEY_ALIAS")\n'
                  '              keyPassword = System.getenv("SSR_KEY_PASS")\n'
                  '          }\n'
                  '      }\n'
              )
              assert 'android {' in s
              s = s.replace('android {', 'android {' + block, 1)
              old = 'signingConfig = signingConfigs.getByName("debug")'
              assert old in s, 'release signing line not found'
              s = s.replace(old, 'signingConfig = signingConfigs.getByName("release")')
              kts.write_text(s)
          else:
              s = groovy.read_text()
              assert 'ssr-release.jks' not in s, 'signing already injected'
              block = (
                  '\n      signingConfigs {\n'
                  '          release {\n'
                  '              storeFile file("ssr-release.jks")\n'
                  '              storePassword System.getenv("SSR_KEYSTORE_PASS")\n'
                  '              keyAlias System.getenv("SSR_KEY_ALIAS")\n'
                  '              keyPassword System.getenv("SSR_KEY_PASS")\n'
                  '          }\n'
                  '      }\n'
              )
              assert 'android {' in s
              s = s.replace('android {', 'android {' + block, 1)
              old = 'signingConfig signingConfigs.debug'
              assert old in s, 'release signing line not found'
              s = s.replace(old, 'signingConfig signingConfigs.release')
              groovy.write_text(s)
          print('signing injected')
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib, re
          kts = pathlib.Path('android/app/build.gradle.kts')
          groovy = pathlib.Path('android/app/build.gradle')
          if kts.exists():
              s = kts.read_text()
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  assert 'android {' in s
                  block = (
                      '\n      compileOptions {\n'
                      '          isCoreLibraryDesugaringEnabled = true\n'
                      '      }\n'
                  )
                  s = s.replace('android {', 'android {' + block, 1)
              if 'desugar_jdk_libs' not in s:
                  dep = (
                      '\n      coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  )
                  m = re.search(r'dependencies\s*\{', s)
                  if m:
                      s = s[:m.end()] + dep + s[m.end():]
                  else:
                      s = s + '\n\ndependencies {\n      coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                      print('--- no dependencies block, appended ---')
                      for line in s.splitlines():
                          if 'dependenc' in line:
                              print(repr(line))
                      print('--- last 15 lines ---')
                      for line in s.splitlines()[-15:]:
                          print(repr(line))
              kts.write_text(s)
              assert 'isCoreLibraryDesugaringEnabled' in kts.read_text()
              assert 'desugar_jdk_libs' in kts.read_text()
          else:
              s = groovy.read_text()
              if 'coreLibraryDesugaringEnabled' not in s:
                  assert 'android {' in s
                  block = (
                      '\n      compileOptions {\n'
                      '          coreLibraryDesugaringEnabled true\n'
                      '      }\n'
                  )
                  s = s.replace('android {', 'android {' + block, 1)
              if 'desugar_jdk_libs' not in s:
                  dep = (
                      '\n      coreLibraryDesugaring \'com.android.tools:desugar_jdk_libs:2.1.4\'\n'
                  )
                  m = re.search(r'dependencies\s*\{', s)
                  if m:
                      s = s[:m.end()] + dep + s[m.end():]
                  else:
                      s = s + '\n\ndependencies {\n      coreLibraryDesugaring \'com.android.tools:desugar_jdk_libs:2.1.4\'\n}\n'
                      print('--- no dependencies block, appended ---')
                      for line in s.splitlines():
                          if 'dependenc' in line:
                              print(repr(line))
                      print('--- last 15 lines ---')
                      for line in s.splitlines()[-15:]:
                          print(repr(line))
              groovy.write_text(s)
              assert 'coreLibraryDesugaringEnabled' in groovy.read_text()
              assert 'desugar_jdk_libs' in groovy.read_text()
          print('desugaring enabled')
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib, re
          # Minify + shrinkResources pada buildType release (KTS+Groovy).
          # Tanpa rules file custom: plugin Flutter membawa consumer-rules
          # sendiri; class yang dirujuk manifest (NotificationListener,
          # ForegroundService, OverlayService, BootReceiver) di-keep
          # otomatis oleh AGP. Tolerant: regex-or-dump, tanpa assert
          # buta pada anchor template (pelajaran desugar Task 8).
          # Idempoten: lewati bila flag sudah ada.
          kts = pathlib.Path('android/app/build.gradle.kts')
          groovy = pathlib.Path('android/app/build.gradle')
          target = kts if kts.exists() else groovy
          assert target.exists(), 'app build gradle tak ketemu'
          s = target.read_text()
          if 'isMinifyEnabled' in s or 'minifyEnabled' in s:
              print('minify sudah aktif, lewati:', target)
          else:
              bt = re.search(r'buildTypes\s*\{', s)
              if not bt:
                  print('--- buildTypes tak ketemu, dump 40 baris ---')
                  for line in s.splitlines()[:40]:
                      print(repr(line))
                  raise SystemExit(1)
              rel = re.search(r'release\s*\{', s[bt.end():])
              if not rel:
                  print('--- release block tak ketemu, dump ---')
                  for line in s.splitlines():
                      if 'buildTypes' in line or 'release' in line:
                          print(repr(line))
                  raise SystemExit(1)
              pos = bt.end() + rel.end()
              if target == kts:
                  ins = (
                      '\n            isMinifyEnabled = true\n'
                      '            isShrinkResources = true'
                  )
              else:
                  ins = (
                      '\n            minifyEnabled true\n'
                      '            shrinkResources true'
                  )
              s = s[:pos] + ins + s[pos:]
              target.write_text(s)
              print('minify patch ok:', target)
          t = target.read_text()
          assert 'isMinifyEnabled = true' in t or 'minifyEnabled true' in t
          assert 'isShrinkResources = true' in t or 'shrinkResources true' in t
          print('minify verify ok')
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          # Scan struk ML Kit (fix 2.8.0+61): R8/shrink tanpa rules men-strip
          # class TextRecognizerOptions + modul bahasa -> NPE saat processImage
          # di device padahal build lolos. Keep inti, dontwarn modul opsional.
          rules = pathlib.Path('android/app/proguard-rules.pro')
          want = (
              '-keep class com.google.mlkit.** { *; }\n'
              '-dontwarn com.google.mlkit.vision.text.chinese.**\n'
              '-dontwarn com.google.mlkit.vision.text.devanagari.**\n'
              '-dontwarn com.google.mlkit.vision.text.japanese.**\n'
              '-dontwarn com.google.mlkit.vision.text.korean.**\n'
          )
          if rules.exists():
              s = rules.read_text()
              if 'com.google.mlkit' not in s:
                  rules.write_text(s.rstrip() + '\n' + want)
          else:
              rules.write_text(want)
          kts = pathlib.Path('android/app/build.gradle.kts')
          groovy = pathlib.Path('android/app/build.gradle')
          target = kts if kts.exists() else groovy
          assert target.exists(), 'app build gradle tak ketemu'
          g = target.read_text()
          if 'proguard-rules.pro' not in g:
              if target == kts:
                  anchor = 'isMinifyEnabled = true'
                  ins = ('\n            proguardFiles('
                         'getDefaultProguardFile("proguard-android-optimize.txt"), '
                         '"proguard-rules.pro")')
              else:
                  anchor = 'minifyEnabled true'
                  ins = ("\n            proguardFiles getDefaultProguardFile("
                         "'proguard-android-optimize.txt'), 'proguard-rules.pro'")
              assert anchor in g, 'anchor minify tak ketemu'
              g = g.replace(anchor, anchor + ins, 1)
              target.write_text(g)
          t = target.read_text()
          assert 'proguard-rules.pro' in t, 'proguard wiring gagal'
          assert 'com.google.mlkit' in rules.read_text()
          print('mlkit proguard ok:', target)
          EOF
