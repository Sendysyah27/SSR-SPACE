      - name: Upload APKs to rolling release (bebas kuota artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          D=build/app/outputs/flutter-apk
          cp "$D/app-release.apk" "$D/SSR-SPACE-$VER-full.apk"
          cp "$D/app-arm64-v8a-release.apk" "$D/SSR-SPACE-$VER-arm64.apk"
          cp "$D/app-armeabi-v7a-release.apk" "$D/SSR-SPACE-$VER-v7a.apk"
          cp "$D/app-x86_64-release.apk" "$D/SSR-SPACE-$VER-x64.apk"
          gh release upload ci-apk "$D/SSR-SPACE-$VER-"*.apk --clobber
