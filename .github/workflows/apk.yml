name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          python3 - <<'EOF'
          import glob, os, pathlib
          # Patch Java plugin notification_listener_service (versi dipin exact
          # di pubspec): baca EXTRA_BIG_TEXT bila EXTRA_TEXT kosong.
          # SeaBank menaruh detail transfer di BigText saja -> tanpa ini
          # content selalu null ("Amount or type unreadable").
          cands = glob.glob(os.path.expanduser(
              '~/.pub-cache/hosted/pub.dev/notification_listener_service-*/'
              'android/src/main/java/notification/listener/service/'
              'NotificationListener.java'))
          assert len(cands) == 1, f'java plugin tidak ketemu: {cands}'
          p = pathlib.Path(cands[0])
          s = p.read_text()
          a_old = 'CharSequence text = extras.getCharSequence(Notification.EXTRA_TEXT);'
          a_new = (a_old + '\n'
                   '            if (text == null) text = extras.getCharSequence(Notification.EXTRA_BIG_TEXT);')
          assert s.count(a_old) == 1, 'pola live EXTRA_TEXT tidak cocok (plugin berubah?)'
          s = s.replace(a_old, a_new)
          b_old = ('notifyData.put("content", extras.getCharSequence(Notification.EXTRA_TEXT) != null\n'
                   '                    ? extras.getCharSequence(Notification.EXTRA_TEXT).toString()\n'
                   '                    : null);')
          b_new = ('CharSequence contentText = extras.getCharSequence(Notification.EXTRA_TEXT);\n'
                   '            if (contentText == null) contentText = extras.getCharSequence(Notification.EXTRA_BIG_TEXT);\n'
                   '            notifyData.put("content", contentText != null\n'
                   '                    ? contentText.toString()\n'
                   '                    : null);')
          assert s.count(b_old) == 1, 'pola scan EXTRA_TEXT tidak cocok (plugin berubah?)'
          s = s.replace(b_old, b_new)
          p.write_text(s)
          assert p.read_text().count('EXTRA_BIG_TEXT') == 2
          print('bigtext patch ok:', cands[0])
          EOF
      - run: |
          if [ ! -d android ]; then
            flutter create . --project-name ssr_space --org com.ssr.space
          fi
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$M"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' "$M"
          fi
          grep -q "android.permission.INTERNET" "$M"
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          if 'NotificationListenerService' not in s:
              svc = '''    <service android:name="notification.listener.service.NotificationListener" android:label="notifications" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
              <intent-filter>
                  <action android:name="android.service.notification.NotificationListenerService" />
              </intent-filter>
          </service>
          '''
              s = s.replace('</application>', svc + '</application>')
              m.write_text(s)
          assert 'NotificationListenerService' in m.read_text()
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          if 'FOREGROUND_SERVICE_SPECIAL_USE' not in s:
              perms = (
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>\n'
              )
              s = s.replace('</manifest>', perms + '</manifest>')
          if 'com.pravera.flutter_foreground_task.service.ForegroundService' not in s:
              svc = '''    <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
            android:foregroundServiceType="specialUse"
            android:exported="false">
            <property android:name="android.app.PROPERTY_FOREGROUND_SERVICE_SPECIAL_USE"
                      android:value="Pencatatan transaksi keuangan dari notifikasi bank saat aplikasi di latar belakang"/>
          </service>
          '''
              s = s.replace('</application>', svc + '</application>')
          m.write_text(s)
          assert 'FOREGROUND_SERVICE_SPECIAL_USE' in m.read_text()
          assert 'com.pravera.flutter_foreground_task.service.ForegroundService' in m.read_text()
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          if 'SYSTEM_ALERT_WINDOW' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n</manifest>',
              )
          if 'flutter.overlay.window.flutter_overlay_window.OverlayService' not in s:
              svc = '''    <service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"
            android:foregroundServiceType="specialUse"
            android:exported="false">
            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                      android:value="Ringkasan koreksi kategori transaksi 30 detik setelah auto-catat"/>
          </service>
          '''
              s = s.replace('</application>', svc + '</application>')
          m.write_text(s)
          assert 'SYSTEM_ALERT_WINDOW' in m.read_text()
          assert 'flutter.overlay.window.flutter_overlay_window.OverlayService' in m.read_text()
          EOF
      - run: flutter analyze
      - run: flutter test
      - name: Setup release signing
        env:
          SSR_KEYSTORE_B64: ${{ secrets.SSR_KEYSTORE_B64 }}
          SSR_KEYSTORE_PASS: ${{ secrets.SSR_KEYSTORE_PASS }}
          SSR_KEY_ALIAS: ${{ secrets.SSR_KEY_ALIAS }}
          SSR_KEY_PASS: ${{ secrets.SSR_KEY_PASS }}
        run: |
          echo "$SSR_KEYSTORE_B64" | base64 -d > android/app/ssr-release.jks
          python3 - <<'EOF'
          import pathlib
          kts = pathlib.Path('android/app/build.gradle.kts')
          groovy = pathlib.Path('android/app/build.gradle')
          if kts.exists():
              s = kts.read_text()
              assert 'ssr-release.jks' not in s, 'signing already injected'
              block = (
                  '\n      signingConfigs {\n'
                  '          create("release") {\n'
                  '              storeFile = file("ssr-release.jks")\n'
                  '              storePassword = System.getenv("SSR_KEYSTORE_PASS")\n'
                  '              keyAlias = System.getenv("SSR_KEY_ALIAS")\n'
                  '              keyPassword = System.getenv("SSR_KEY_PASS")\n'
                  '          }\n'
                  '      }\n'
              )
              assert 'android {' in s
              s = s.replace('android {', 'android {' + block, 1)
              old = 'signingConfig = signingConfigs.getByName("debug")'
              assert old in s, 'release signing line not found'
              s = s.replace(old, 'signingConfig = signingConfigs.getByName("release")')
              kts.write_text(s)
          else:
              s = groovy.read_text()
              assert 'ssr-release.jks' not in s, 'signing already injected'
              block = (
                  '\n      signingConfigs {\n'
                  '          release {\n'
                  '              storeFile file("ssr-release.jks")\n'
                  '              storePassword System.getenv("SSR_KEYSTORE_PASS")\n'
                  '              keyAlias System.getenv("SSR_KEY_ALIAS")\n'
                  '              keyPassword System.getenv("SSR_KEY_PASS")\n'
                  '          }\n'
                  '      }\n'
              )
              assert 'android {' in s
              s = s.replace('android {', 'android {' + block, 1)
              old = 'signingConfig signingConfigs.debug'
              assert old in s, 'release signing line not found'
              s = s.replace(old, 'signingConfig signingConfigs.release')
              groovy.write_text(s)
          print('signing injected')
          EOF
      - run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        env:
          SSR_KEYSTORE_PASS: ${{ secrets.SSR_KEYSTORE_PASS }}
          SSR_KEY_ALIAS: ${{ secrets.SSR_KEY_ALIAS }}
          SSR_KEY_PASS: ${{ secrets.SSR_KEY_PASS }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssr-space-apk
          path: build/app/outputs/flutter-apk/app-release.apk
