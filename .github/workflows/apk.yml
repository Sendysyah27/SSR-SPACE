name: build-apk
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: |
          python3 - <<'EOF'
          import glob, os, pathlib, re
          # Patch Java plugin notification_listener_service (versi dipin exact
          # di pubspec): baca EXTRA_BIG_TEXT bila EXTRA_TEXT kosong.
          # SeaBank menaruh detail transfer di BigText saja -> tanpa ini
          # content selalu null ("Amount or type unreadable").
          # Idempoten + diagnostik: gagal = dump konteks, bukan diam.
          cands = glob.glob(os.path.expanduser(
              '~/.pub-cache/hosted/pub.dev/notification_listener_service-*/'
              'android/src/main/java/notification/listener/service/'
              'NotificationListener.java'))
          assert len(cands) == 1, f'java plugin tidak ketemu: {cands}'
          p = pathlib.Path(cands[0])
          s = p.read_text()
          if 'EXTRA_BIG_TEXT' in s:
              print('sudah di-patch, lewati:', cands[0])
          else:
              def show(tag):
                  print(f'--- {tag} ---')
                  for line in s.splitlines():
                      if 'EXTRA_TEXT' in line:
                          print(repr(line))
              a_pat = re.compile(
                  r'CharSequence text = extras\.getCharSequence\(Notification\.EXTRA_TEXT\);')
              if len(a_pat.findall(s)) != 1:
                  show('POLA LIVE GAGAL'); raise SystemExit(1)
              s = a_pat.sub(
                  'CharSequence text = extras.getCharSequence(Notification.EXTRA_TEXT);\n'
                  '            if (text == null) text = extras.getCharSequence(Notification.EXTRA_BIG_TEXT);',
                  s)
              b_pat = re.compile(
                  r'notifyData\.put\("content",\s*extras\.getCharSequence\(Notification\.EXTRA_TEXT\)\s*!=\s*null\s*\?\s*extras\.getCharSequence\(Notification\.EXTRA_TEXT\)\.toString\(\)\s*:\s*null\);')
              if len(b_pat.findall(s)) != 1:
                  show('POLA SCAN GAGAL'); raise SystemExit(1)
              s = b_pat.sub(
                  'CharSequence contentText = extras.getCharSequence(Notification.EXTRA_TEXT);\n'
                  '            if (contentText == null) contentText = extras.getCharSequence(Notification.EXTRA_BIG_TEXT);\n'
                  '            notifyData.put("content", contentText != null\n'
                  '                    ? contentText.toString()\n'
                  '                    : null);',
                  s)
              p.write_text(s)
              assert p.read_text().count('EXTRA_BIG_TEXT') == 2
              print('bigtext patch ok:', cands[0])
          EOF
      - run: |
          if [ ! -d android ]; then
            flutter create . --project-name ssr_space --org com.ssr.space
          fi
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$M"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' "$M"
          fi
          grep -q "android.permission.INTERNET" "$M"
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          if 'NotificationListenerService' not in s:
              svc = '''    <service android:name="notification.listener.service.NotificationListener" android:label="notifications" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
              <intent-filter>
                  <action android:name="android.service.notification.NotificationListenerService" />
              </intent-filter>
          </service>
          '''
              s = s.replace('</application>', svc + '</application>')
              m.write_text(s)
          assert 'NotificationListenerService' in m.read_text()
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          if 'FOREGROUND_SERVICE_SPECIAL_USE' not in s:
              perms = (
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>\n'
              )
              s = s.replace('</manifest>', perms + '</manifest>')
          if 'com.pravera.flutter_foreground_task.service.ForegroundService' not in s:
              svc = '''    <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
            android:foregroundServiceType="specialUse"
            android:exported="false">
            <property android:name="android.app.PROPERTY_FOREGROUND_SERVICE_SPECIAL_USE"
                      android:value="Pencatatan transaksi keuangan dari notifikasi bank saat aplikasi di latar belakang"/>
          </service>
          '''
              s = s.replace('</application>', svc + '</application>')
          m.write_text(s)
          assert 'FOREGROUND_SERVICE_SPECIAL_USE' in m.read_text()
          assert 'com.pravera.flutter_foreground_task.service.ForegroundService' in m.read_text()
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          if 'SYSTEM_ALERT_WINDOW' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n</manifest>',
              )
          if 'flutter.overlay.window.flutter_overlay_window.OverlayService' not in s:
              svc = '''    <service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"
            android:foregroundServiceType="specialUse"
            android:exported="false">
            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                      android:value="Ringkasan koreksi kategori transaksi 30 detik setelah auto-catat"/>
          </service>
          '''
              s = s.replace('</application>', svc + '</application>')
          m.write_text(s)
          assert 'SYSTEM_ALERT_WINDOW' in m.read_text()
          assert 'flutter.overlay.window.flutter_overlay_window.OverlayService' in m.read_text()
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          # Pengingat harian (flutter_local_notifications): POST_NOTIFICATIONS
          # untuk Android 13+. Izin lain tidak ditambah di task ini.
          # Catatan Task 9 (minify/shrink): bila minifyEnabled=true, tambah
          # keep-rules plugin ini di android/app/proguard-rules.pro:
          # -keep class com.dexterous.flutterlocalnotifications.** { *; }
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>',
              )
          m.write_text(s)
          assert 'android.permission.POST_NOTIFICATIONS' in m.read_text()
          print('post-notifications permission ok')
          EOF
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          # Deep link magic-link ganti PIN: com.ssr.space.ssrspace://login-callback
          # (lihat pin_link_verify.dart; redirect URL didaftarkan di Dashboard).
          if 'com.ssr.space.ssrspace' not in s:
              filt = '''          <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="com.ssr.space.ssrspace" android:host="login-callback" />
          </intent-filter>
          '''
              assert '</activity>' in s, 'activity block tak ketemu'
              s = s.replace('</activity>', filt + '      </activity>', 1)
              m.write_text(s)
          assert 'com.ssr.space.ssrspace' in m.read_text()
          print('deeplink intent-filter ok')
          EOF
      - run: flutter analyze
      - run: flutter test
      - name: Setup release signing
        env:
          SSR_KEYSTORE_B64: ${{ secrets.SSR_KEYSTORE_B64 }}
          SSR_KEYSTORE_PASS: ${{ secrets.SSR_KEYSTORE_PASS }}
          SSR_KEY_ALIAS: ${{ secrets.SSR_KEY_ALIAS }}
          SSR_KEY_PASS: ${{ secrets.SSR_KEY_PASS }}
        run: |
          echo "$SSR_KEYSTORE_B64" | base64 -d > android/app/ssr-release.jks
          python3 - <<'EOF'
          import pathlib
          kts = pathlib.Path('android/app/build.gradle.kts')
          groovy = pathlib.Path('android/app/build.gradle')
          if kts.exists():
              s = kts.read_text()
              assert 'ssr-release.jks' not in s, 'signing already injected'
              block = (
                  '\n      signingConfigs {\n'
                  '          create("release") {\n'
                  '              storeFile = file("ssr-release.jks")\n'
                  '              storePassword = System.getenv("SSR_KEYSTORE_PASS")\n'
                  '              keyAlias = System.getenv("SSR_KEY_ALIAS")\n'
                  '              keyPassword = System.getenv("SSR_KEY_PASS")\n'
                  '          }\n'
                  '      }\n'
              )
              assert 'android {' in s
              s = s.replace('android {', 'android {' + block, 1)
              old = 'signingConfig = signingConfigs.getByName("debug")'
              assert old in s, 'release signing line not found'
              s = s.replace(old, 'signingConfig = signingConfigs.getByName("release")')
              kts.write_text(s)
          else:
              s = groovy.read_text()
              assert 'ssr-release.jks' not in s, 'signing already injected'
              block = (
                  '\n      signingConfigs {\n'
                  '          release {\n'
                  '              storeFile file("ssr-release.jks")\n'
                  '              storePassword System.getenv("SSR_KEYSTORE_PASS")\n'
                  '              keyAlias System.getenv("SSR_KEY_ALIAS")\n'
                  '              keyPassword System.getenv("SSR_KEY_PASS")\n'
                  '          }\n'
                  '      }\n'
              )
              assert 'android {' in s
              s = s.replace('android {', 'android {' + block, 1)
              old = 'signingConfig signingConfigs.debug'
              assert old in s, 'release signing line not found'
              s = s.replace(old, 'signingConfig signingConfigs.release')
              groovy.write_text(s)
          print('signing injected')
          EOF
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        env:
          SSR_KEYSTORE_PASS: ${{ secrets.SSR_KEYSTORE_PASS }}
          SSR_KEY_ALIAS: ${{ secrets.SSR_KEY_ALIAS }}
          SSR_KEY_PASS: ${{ secrets.SSR_KEY_PASS }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssr-space-apk
          path: build/app/outputs/flutter-apk/app-release.apk
