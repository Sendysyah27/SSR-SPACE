name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          if [ ! -d android ]; then
            flutter create . --project-name ssr_space --org com.ssr.space
          fi
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$M"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' "$M"
          fi
          grep -q "android.permission.INTERNET" "$M"
      - run: |
          python3 - <<'EOF'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          if 'NotificationListenerService' not in s:
              svc = '''    <service android:name="notification.listener.service.NotificationListener" android:label="notifications" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
              <intent-filter>
                  <action android:name="android.service.notification.NotificationListenerService" />
              </intent-filter>
          </service>
          '''
              s = s.replace('</application>', svc + '</application>')
              m.write_text(s)
          assert 'NotificationListenerService' in m.read_text()
          EOF
      - run: flutter test
      - run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ssr-space-apk
          path: build/app/outputs/flutter-apk/app-release.apk
